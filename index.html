<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff4fc3" />
    <meta name="description" content="Duhove kolo submission technik pro grappling zapasy a drilly." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Submission Rooster" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Sviskej Koninko submission rooster</title>
    <style>
:root {
  color-scheme: dark;
  --ink: #fff9ff;
  --muted: rgba(255, 249, 255, 0.72);
  --line: rgba(255, 255, 255, 0.22);
  --panel: rgba(16, 18, 34, 0.72);
  --panel-strong: rgba(20, 22, 44, 0.92);
  --shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background:
    radial-gradient(circle at 18% 8%, rgba(255, 244, 92, 0.95) 0 9%, transparent 22%),
    radial-gradient(circle at 85% 12%, rgba(62, 240, 255, 0.88) 0 10%, transparent 25%),
    linear-gradient(135deg, #ff416c 0%, #ff9b36 18%, #ffe85c 34%, #54e36e 50%, #26c7ff 66%, #6c5cff 82%, #fa58cf 100%);
}

body {
  min-height: 100vh;
  margin: 0;
  color: var(--ink);
  background:
    linear-gradient(180deg, rgba(8, 7, 21, 0.06), rgba(8, 7, 21, 0.62)),
    repeating-linear-gradient(120deg, rgba(255, 255, 255, 0.08) 0 1px, transparent 1px 14px);
}

button,
input {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

.app-shell {
  width: min(100%, 520px);
  min-height: 100vh;
  margin: 0 auto;
  padding: max(18px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
}

.hero {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0 16px;
}

.kicker {
  margin: 0 0 6px;
  color: rgba(255, 255, 255, 0.8);
  font-size: 0.72rem;
  font-weight: 850;
  letter-spacing: 0;
  text-transform: uppercase;
}

h1,
h2 {
  margin: 0;
  letter-spacing: 0;
}

h1 {
  max-width: 330px;
  font-size: clamp(2rem, 12vw, 3.7rem);
  line-height: 0.87;
  text-wrap: balance;
  text-shadow: 0 4px 24px rgba(0, 0, 0, 0.28);
}

h2 {
  font-size: 1.08rem;
}

.match-chip {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  gap: 7px;
  min-height: 32px;
  padding: 7px 10px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.16);
  color: rgba(255, 255, 255, 0.86);
  font-size: 0.74rem;
  font-weight: 800;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
  backdrop-filter: blur(18px);
}

.match-chip span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #7fff63;
  box-shadow: 0 0 18px #7fff63;
}

.wheel-stage {
  padding: 10px 0 18px;
}

.wheel-wrap {
  position: relative;
  display: grid;
  place-items: center;
  width: min(100%, 430px);
  aspect-ratio: 1;
  margin: 0 auto;
  border-radius: 50%;
  filter: drop-shadow(var(--shadow));
}

#wheel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.18);
}

.pointer {
  position: absolute;
  top: -4px;
  left: 50%;
  width: 0;
  height: 0;
  transform: translateX(-50%);
  border-left: 20px solid transparent;
  border-right: 20px solid transparent;
  border-top: 42px solid #fff;
  filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.35));
  z-index: 3;
}

.spin-button {
  position: absolute;
  width: min(38%, 148px);
  aspect-ratio: 1;
  border: 6px solid rgba(255, 255, 255, 0.62);
  border-radius: 50%;
  background:
    radial-gradient(circle at 34% 22%, rgba(255, 255, 255, 0.94), rgba(255, 255, 255, 0.22) 28%, transparent 29%),
    linear-gradient(135deg, #fff04f, #ff4ec2 42%, #5b5cff 78%, #32fff3);
  color: #171225;
  font-weight: 1000;
  letter-spacing: 0;
  box-shadow: inset 0 -12px 24px rgba(0, 0, 0, 0.22), 0 14px 34px rgba(0, 0, 0, 0.34);
  cursor: pointer;
  transition: transform 140ms ease, filter 140ms ease;
}

.spin-button:active {
  transform: scale(0.96);
}

.spin-button:disabled {
  cursor: wait;
  filter: saturate(0.7);
}

.spin-button span {
  display: block;
  padding: 0 10px;
  font-size: clamp(0.86rem, 4vw, 1.06rem);
  line-height: 1.05;
  text-transform: uppercase;
}

.result {
  display: block;
  min-height: 70px;
  margin: 14px 0 0;
  padding: 16px;
  border: 1px solid rgba(255, 255, 255, 0.34);
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.22);
  color: #fff;
  font-size: 1.16rem;
  font-weight: 900;
  line-height: 1.18;
  text-align: center;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.24);
  backdrop-filter: blur(18px);
}

.panel,
.install-panel {
  padding: 16px;
  border: 1px solid rgba(255, 255, 255, 0.26);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: 0 18px 52px rgba(0, 0, 0, 0.22);
  backdrop-filter: blur(18px);
}

.install-panel {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-top: 12px;
}

.install-panel p:last-child {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 700;
  line-height: 1.25;
}

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.icon-text-button,
.add-form button,
.install-button {
  min-width: 46px;
  min-height: 42px;
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.16);
  color: #fff;
  font-weight: 900;
  cursor: pointer;
}

.technique-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.technique {
  position: relative;
}

.technique input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.technique span {
  display: grid;
  align-items: center;
  min-height: 46px;
  padding: 9px 10px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.12);
  color: rgba(255, 255, 255, 0.78);
  font-size: 0.88rem;
  font-weight: 820;
  line-height: 1.05;
  cursor: pointer;
  transition: transform 140ms ease, background 140ms ease, color 140ms ease;
}

.technique input:checked + span {
  border-color: rgba(255, 255, 255, 0.55);
  background: linear-gradient(135deg, rgba(255, 235, 79, 0.95), rgba(255, 72, 192, 0.9), rgba(45, 220, 255, 0.9));
  color: #160f24;
  box-shadow: 0 9px 22px rgba(0, 0, 0, 0.22);
}

.technique input:focus-visible + span,
.icon-text-button:focus-visible,
.add-form button:focus-visible,
.install-button:focus-visible,
.spin-button:focus-visible,
.add-form input:focus-visible {
  outline: 3px solid rgba(255, 255, 255, 0.82);
  outline-offset: 3px;
}

.add-form {
  margin-top: 14px;
}

.add-form label {
  display: block;
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 820;
}

.add-form div {
  display: grid;
  grid-template-columns: 1fr 48px;
  gap: 8px;
}

.add-form input {
  min-width: 0;
  min-height: 46px;
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 8px;
  background: rgba(4, 5, 16, 0.42);
  color: #fff;
  padding: 0 12px;
}

.add-form input::placeholder {
  color: rgba(255, 255, 255, 0.5);
}

@media (max-width: 380px) {
  .hero {
    display: block;
  }

  .match-chip {
    margin-top: 12px;
  }

  .technique-list {
    grid-template-columns: 1fr;
  }

  .install-panel {
    align-items: stretch;
    flex-direction: column;
  }
}

    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-labelledby="app-title">
        <div>
          <p class="kicker">Grappling match randomizer</p>
          <h1 id="app-title">Sviskej Koninko submission rooster</h1>
        </div>
        <div class="match-chip" aria-label="Závodní režim">
          <span></span>
          Zítra na závody
        </div>
      </section>

      <section class="wheel-stage" aria-label="Kolo technik">
        <div class="wheel-wrap">
          <canvas id="wheel" width="720" height="720" aria-label="Kolo štěstí s technikami"></canvas>
          <div class="pointer" aria-hidden="true"></div>
          <button id="spin-button" class="spin-button" type="button">
            <span>Roztočit</span>
          </button>
        </div>

        <output id="result" class="result" aria-live="polite">
          Vyber techniky a roztoč kohouta.
        </output>
      </section>

      <section class="panel" aria-labelledby="techniques-title">
        <div class="panel-head">
          <div>
            <p class="kicker">Techniky v kole</p>
            <h2 id="techniques-title">Submission menu</h2>
          </div>
          <button id="toggle-all" class="icon-text-button" type="button">Vše</button>
        </div>

        <div id="technique-list" class="technique-list"></div>

        <form id="add-form" class="add-form">
          <label for="custom-technique">Přidat techniku</label>
          <div>
            <input id="custom-technique" name="custom-technique" type="text" autocomplete="off" placeholder="např. Peruvian necktie" />
            <button type="submit">+</button>
          </div>
        </form>
      </section>

    </main>

    <script>
const defaultTechniques = [
  "Armbar",
  "Triangle choke",
  "Rear naked choke",
  "Kimura",
  "Guillotine",
  "D'arce choke",
  "Americana",
  "Straight ankle lock",
  "Omoplata",
  "Kneebar",
  "Ezekiel choke",
  "Baseball bat choke"
];

const palette = [
  "#ff3f8f",
  "#ff7a2f",
  "#ffe84c",
  "#54e36e",
  "#20d7ff",
  "#5b5cff",
  "#b94cff",
  "#ff57d8"
];

const canvas = document.querySelector("#wheel");
const ctx = canvas.getContext("2d");
const list = document.querySelector("#technique-list");
const spinButton = document.querySelector("#spin-button");
const result = document.querySelector("#result");
const toggleAll = document.querySelector("#toggle-all");
const addForm = document.querySelector("#add-form");
const customInput = document.querySelector("#custom-technique");
function loadTechniques() {
  const saved = JSON.parse(localStorage.getItem("submission-rooster") || "null");
  if (saved?.length) {
    return saved;
  }

  return defaultTechniques.map((name) => ({ name, enabled: true }));
}

function saveTechniques() {
  localStorage.setItem("submission-rooster", JSON.stringify(techniques));
}

function enabledTechniques() {
  return techniques.filter((technique) => technique.enabled);
}

function renderTechniqueList() {
  list.innerHTML = "";

  techniques.forEach((technique, index) => {
    const label = document.createElement("label");
    label.className = "technique";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = technique.enabled;
    checkbox.addEventListener("change", () => {
      techniques[index].enabled = checkbox.checked;
      saveTechniques();
      drawWheel();
    });

    const text = document.createElement("span");
    text.textContent = technique.name;

    label.append(checkbox, text);
    list.append(label);
  });
}

function drawWheel() {
  const active = enabledTechniques();
  const size = canvas.width;
  const center = size / 2;
  const radius = center - 18;

  ctx.clearRect(0, 0, size, size);
  ctx.save();
  ctx.translate(center, center);
  ctx.rotate(rotation);

  if (!active.length) {
    drawEmptyWheel(radius);
    ctx.restore();
    return;
  }

  const slice = (Math.PI * 2) / active.length;

  active.forEach((technique, index) => {
    const start = index * slice - Math.PI / 2;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, radius, start, end);
    ctx.closePath();
    ctx.fillStyle = palette[index % palette.length];
    ctx.fill();

    ctx.strokeStyle = "rgba(255, 255, 255, 0.72)";
    ctx.lineWidth = 5;
    ctx.stroke();

    drawSliceText(technique.name, start + slice / 2, radius);
  });

  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.lineWidth = 16;
  ctx.strokeStyle = "rgba(255, 255, 255, 0.88)";
  ctx.stroke();

  ctx.restore();
}

function drawSliceText(text, angle, radius) {
  ctx.save();
  ctx.rotate(angle);
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#171225";
  ctx.font = "900 28px system-ui, sans-serif";
  ctx.shadowColor = "rgba(255, 255, 255, 0.55)";
  ctx.shadowBlur = 8;

  const words = text.split(" ");
  const lines = words.length > 2 ? [words.slice(0, -1).join(" "), words.at(-1)] : [text];
  lines.forEach((line, lineIndex) => {
    ctx.fillText(line, radius - 34, (lineIndex - (lines.length - 1) / 2) * 28, radius * 0.62);
  });

  ctx.restore();
}

function drawEmptyWheel(radius) {
  const gradient = ctx.createConicGradient(0, 0, 0);
  palette.forEach((color, index) => gradient.addColorStop(index / palette.length, color));
  gradient.addColorStop(1, palette[0]);

  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.fillStyle = gradient;
  ctx.fill();
  ctx.lineWidth = 16;
  ctx.strokeStyle = "rgba(255, 255, 255, 0.88)";
  ctx.stroke();

  ctx.fillStyle = "#171225";
  ctx.font = "900 34px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("Zapni techniky", 0, 0);
}

function selectedAtPointer(active) {
  const slice = (Math.PI * 2) / active.length;
  const normalized = ((-rotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  const index = Math.floor(normalized / slice) % active.length;
  return active[index];
}

function spin() {
  const active = enabledTechniques();

  if (spinning || !active.length) {
    result.value = "Nejdřív zapni aspoň jednu techniku.";
    return;
  }

  spinning = true;
  spinButton.disabled = true;
  result.value = "Točíme...";

  const start = rotation;
  const extraTurns = 5 + Math.random() * 3;
  const target = start + extraTurns * Math.PI * 2 + Math.random() * Math.PI * 2;
  const duration = 3600;
  const startedAt = performance.now();

  function frame(now) {
    const progress = Math.min((now - startedAt) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 4);
    rotation = start + (target - start) * eased;
    drawWheel();

    if (progress < 1) {
      requestAnimationFrame(frame);
      return;
    }

    rotation = ((rotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const picked = selectedAtPointer(active);
    result.value = `${picked.name}!`;
    spinning = false;
    spinButton.disabled = false;
  }

  requestAnimationFrame(frame);
}

spinButton.addEventListener("click", spin);

toggleAll.addEventListener("click", () => {
  const shouldEnable = techniques.some((technique) => !technique.enabled);
  techniques = techniques.map((technique) => ({ ...technique, enabled: shouldEnable }));
  saveTechniques();
  renderTechniqueList();
  drawWheel();
});

addForm.addEventListener("submit", (event) => {
  event.preventDefault();
  const name = customInput.value.trim();

  if (!name) {
    return;
  }

  techniques.push({ name, enabled: true });
  customInput.value = "";
  saveTechniques();
  renderTechniqueList();
  drawWheel();
});

renderTechniqueList();
drawWheel();

    </script>
  </body>
</html>
